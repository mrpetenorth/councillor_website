<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hull Independent Councillors</title>

<style>
:root{
  --primary:#597265;
  --light:#f4f7f5;
  --dark:#243029;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:#f7f9f8;
  color:var(--dark);

  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  text-align:center;
  padding:40px;
}

.container{
  max-width:900px;
}

h1{
  font-size:2.4rem;
  margin-bottom:10px;
}

p{
  margin-bottom:30px;
  color:#444;
  font-size:1.05rem;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:20px;
}

.card{
  background:white;
  border-radius:12px;
  padding:26px;

  box-shadow:0 6px 18px rgba(0,0,0,0.06);
  border:1px solid rgba(0,0,0,0.05);

  transition:transform 0.2s ease, box-shadow 0.2s ease;
  cursor:pointer;
  text-decoration:none;
  color:inherit;
}

.card:hover{
  transform:translateY(-4px);
  box-shadow:0 10px 26px rgba(0,0,0,0.1);
}

.card h2{
  color:var(--primary);
  font-size:1.2rem;
  margin-bottom:8px;
}

.card p{
  font-size:0.95rem;
  margin:0;
}
</style>
</head>

<body>

<div class="container">

  <h1>Hull Independent Councillors</h1>

  <p>Select your local councillor</p>

  <div class="cards">

    <a class="card" href="hester-bridges.html">
      <h2>Cllr Hester Bridges</h2>
      <p>Southcoates Ward</p>
    </a>

    <a class="card" href="peter-north.html">
      <h2>Cllr Peter North</h2>
      <p>Bricknell Ward</p>
    </a>

    <a class="card" href="gary-wareing.html">
      <h2>Cllr Gary Wareing</h2>
      <p>Orchard Park Ward</p>
    </a>

  </div>

</div>

</body>
</html>
